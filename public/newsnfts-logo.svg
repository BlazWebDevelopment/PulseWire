<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-labelledby="title desc">
  <title id="title">News NFTs logo</title>
  <desc id="desc">News NFTs wordmark with a compact monogram icon.</desc>
  <defs>
    <linearGradient id="nn-mark" x1="16" y1="12" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="nn-panel" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 18)">
    <rect x="0" y="0" width="60" height="60" rx="10" fill="url(#nn-panel)"/>
    <rect x="0.75" y="0.75" width="58.5" height="58.5" rx="9.25" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <path
      d="M14 42V18H19.2L32 31V18H37V42H31.8L19 29V42H14Z"
      fill="url(#nn-mark)"
    />
    <rect x="34" y="16" width="6.5" height="6.5" fill="#f59e0b" stroke="#fde68a" stroke-width="0.8"/>
  </g>

  <g transform="translate(86 0)">
    <text
      x="0"
      y="50"
      fill="#0f172a"
      font-size="40"
      font-weight="900"
      font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      letter-spacing="-1.8"
    >
      News
    </text>
    <text
      x="106"
      y="50"
      fill="#2563eb"
      font-size="40"
      font-weight="900"
      font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      letter-spacing="-1.8"
    >
      NFTs
    </text>
    <text
      x="2"
      y="72"
      fill="#64748b"
      font-size="10"
      font-weight="700"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      letter-spacing="2.6"
    >
