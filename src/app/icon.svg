<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="nn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e22"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="nn-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="nn-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#nn-bg)"/>
  <rect x="2" y="2" width="28" height="28" rx="5.5" fill="none" stroke="rgba(59,130,246,0.28)" stroke-width="1"/>
  <!-- Hexagon outline (NFT/blockchain motif) -->
  <path d="M16 4.6 L25.5 9.8 L25.5 22.2 L16 27.4 L6.5 22.2 L6.5 9.8 Z"
        fill="none"
        stroke="url(#nn-blue)"
        stroke-width="1.2"
        opacity="0.55"
        filter="url(#nn-glow)"/>
  <!-- Stylized "N" mark -->
  <path d="M10.5 22.5 L10.5 9.5 L13 9.5 L21.5 19 L21.5 9.5 L24 9.5 L24 22.5 L21.5 22.5 L13 13 L13 22.5 Z"
        fill="url(#nn-blue)"
        filter="url(#nn-glow)"/>
  <!-- Data dot -->
  <circle cx="24.5" cy="8.5" r="1.6" fill="#ffffff"/>
  <circle cx="24.5" cy="8.5" r="2.8" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.45"/>
  <rect x="2" y="26.5" width="28" height="1.2" fill="url(#nn-blue)" opacity="0.7"/>
</svg>
